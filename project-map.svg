ns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">routes</div></div></foreignObject></g><g data-depth="3" data-path="1.3.9" class="markmap-node" transform="translate(197, 47.75)"><line stroke="#ff7f0e" stroke-width="1.375" x1="-1" x2="58" y1="20.6875" y2="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="40" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">views</div></div></foreignObject></g><g data-depth="2" data-path="1.3" class="markmap-node" transform="translate(80, -9.8125)"><line stroke="#2ca02c" stroke-width="1.75" x1="-1" x2="39" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#2ca02c" fill="var(--markmap-circle-open-bg)" cx="37" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="21" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">src</div></div></foreignObject></g><g data-depth="2" data-path="1.10" class="markmap-node" transform="translate(80, 79.125)"><line stroke="#2ca02c" stroke-width="1.75" x1="-1" x2="84" y1="20.875" y2="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="66" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">.gitignore</div></div></foreignObject></g><g data-depth="1" data-path="1" class="markmap-node" transform="translate(0,0)"><line stroke="#1f77b4" stroke-width="2.5" x1="-1" x2="2" y1="1.25" y2="1.25"/><circle stroke-width="1.5" r="6" stroke="#1f77b4" fill="var(--markmap-circle-open-bg)" cx="0" cy="1.25"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml"></div></div></foreignObject></g></g></svg>